{% if recientes %}
<section class="mt-2">
    <h2 class="section-title">Vistos recientemente</h2>
    <div class="recientes">
        {% for p in recientes %}
            <a class="btn btn-secondary" href="{% url 'producto_detalle' p.id %}">{{ p.nombre }}</a>
        {% endfor %}
    </div>
</section>
{% endif %}
